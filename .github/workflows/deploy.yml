name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Build and publish image to GHCR ──────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── 2. Deploy image to server ────────────────────────────────────────────────
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    env:
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}

    steps:
      - name: Setup SSH key
        shell: bash
        run: |
          set -euo pipefail

          echo "=== [1/4] Creating SSH directory ==="
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "✓ SSH directory ready"

          echo "=== [2/4] Writing SSH private key ==="
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "✓ SSH key written ($(wc -c < ~/.ssh/id_ed25519) bytes)"
          
          echo "=== [2b] SSH key format check ==="
          echo "First line: $(head -1 ~/.ssh/id_ed25519)"
          echo "Last line: $(tail -1 ~/.ssh/id_ed25519)"

          echo "=== [3/4] Validating SSH key format ==="
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "✗ Invalid SSH private key format"
            exit 1
          fi
          echo "✓ SSH key is valid"

          echo "=== [4/4] Fetching host key ==="
          echo "Target: ${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }}"
          if ! ssh-keyscan -T 10 -H -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
            echo "✗ Failed to fetch host key"
            cat /tmp/ssh-keyscan.err
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts
          echo "✓ Host key added to known_hosts"

      - name: Debug SSH key fingerprint
        run: |
          echo "=== Key file first/last lines ==="
          head -1 ~/.ssh/id_ed25519
          tail -1 ~/.ssh/id_ed25519
          echo "=== Fingerprint of key in secret ==="
          ssh-keygen -lf ~/.ssh/id_ed25519

      - name: Validate SSH connectivity
        run: |
          echo "=== Testing SSH connection ==="
          echo "User: ${{ secrets.SSH_USER }}"
          echo "Host: ${{ secrets.SSH_HOST }}"
          echo "Port: ${{ secrets.SSH_PORT }}"
          
          if [[ -n "$SSH_PASSPHRASE" ]]; then
            echo "[*] Setting up SSH agent with passphrase..."
            eval "$(ssh-agent -s)"
            trap 'ssh-agent -k' EXIT
            printf '#!/usr/bin/env bash\nprintf '\''%%s\\n'\'' "$SSH_PASSPHRASE"\n' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            export SSH_ASKPASS="$HOME/.ssh/askpass.sh"
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            setsid ssh-add ~/.ssh/id_ed25519 < /dev/null
            echo "✓ SSH agent configured"
          else
            echo "[*] No passphrase - using key directly"
          fi
          
          echo "[*] Attempting connection..."
          if ssh -vvv -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo '[deploy] SSH connection OK'"; then
            echo "✓ SSH connection successful"
          else
            echo "✗ SSH connection failed with exit code $?"
            exit 1
          fi

      - name: Pull new image and restart container
        run: |
          if [[ -n "$SSH_PASSPHRASE" ]]; then
            eval "$(ssh-agent -s)"
            trap 'ssh-agent -k' EXIT
            printf '#!/usr/bin/env bash\nprintf '\''%%s\\n'\'' "$SSH_PASSPHRASE"\n' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            export SSH_ASKPASS="$HOME/.ssh/askpass.sh"
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            setsid ssh-add ~/.ssh/id_ed25519 < /dev/null
          fi
          
          echo "=== Executing deploy commands on server ==="
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'
          set -ex
          echo "=== [1/5] Entering deployment directory ==="
          cd "${{ secrets.DEPLOY_PATH }}"
          pwd
          
          echo "=== [2/5] Logging into GHCR ==="
          echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USER }}' --password-stdin
          echo "✓ GHCR login successful"
          
          echo "=== [3/5] Pulling latest image ==="
          IMAGE_TAG=main docker compose pull
          echo "✓ Image pulled"
          
          echo "=== [4/5] Starting containers ==="
          IMAGE_TAG=main docker compose up -d --remove-orphans
          echo "✓ Containers started"
          
          echo "=== [5/5] Cleaning up ==="
          docker image prune -f
          echo "✓ Cleanup complete"
          
          echo "=== Deploy completed successfully ==="
          EOF
