name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Build and publish image to GHCR ──────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── 2. Deploy image to server ────────────────────────────────────────────────
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    env:
      SSH_PASSPHRASE: ${{ secrets.SSH_PHRASE }}

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Debug SSH key fingerprint
        run: |
          echo "=== Key file first/last lines ==="
          head -1 ~/.ssh/id_ed25519
          tail -1 ~/.ssh/id_ed25519
          echo "=== Fingerprint of key in secret ==="
          ssh-keygen -lf ~/.ssh/id_ed25519

      - name: Validate SSH connectivity
        run: |
          if [[ -n "$SSH_PASSPHRASE" ]]; then
            eval "$(ssh-agent -s)"
            trap 'ssh-agent -k' EXIT
            printf '#!/usr/bin/env bash\nprintf '\''%%s\\n'\'' "$SSH_PASSPHRASE"\n' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            export SSH_ASKPASS="$HOME/.ssh/askpass.sh"
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            setsid ssh-add ~/.ssh/id_ed25519 < /dev/null
          fi
          ssh -vvv -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo '[deploy] SSH connection OK'"

      - name: Pull new image and restart container
        run: |
          if [[ -n "$SSH_PASSPHRASE" ]]; then
            eval "$(ssh-agent -s)"
            trap 'ssh-agent -k' EXIT
            printf '#!/usr/bin/env bash\nprintf '\''%%s\\n'\'' "$SSH_PASSPHRASE"\n' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            export SSH_ASKPASS="$HOME/.ssh/askpass.sh"
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            setsid ssh-add ~/.ssh/id_ed25519 < /dev/null
          fi
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'
          set -e
          cd "${{ secrets.DEPLOY_PATH }}"
          echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USER }}' --password-stdin
          IMAGE_TAG=main docker compose pull
          IMAGE_TAG=main docker compose up -d --remove-orphans
          docker image prune -f
          EOF
